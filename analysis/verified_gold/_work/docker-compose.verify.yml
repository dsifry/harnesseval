# Verification services for the "verified hidden gold" evidence pipeline.
#
# Isolated, throwaway Postgres/Redis used ONLY to execute database-semantics claims
# (unique constraints, transaction races, Redis throttle keys) that mocks cannot prove.
# Nothing here is part of the benchmark campaign; no campaign artifact depends on it.
#
#   docker compose -f docker-compose.verify.yml up -d
#   docker compose -f docker-compose.verify.yml down -v     # wipe when done
#
# Ports are non-default on purpose so they cannot collide with a developer's own services.
services:
  verify-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: verify
      POSTGRES_DB: verify_cal
      # cal.com's Prisma schema needs a shadow DB only for migrations; db push does not.
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verify"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]   # in-memory: fast, and discarded on down -v

  verify-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
