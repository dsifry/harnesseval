[project]
name = "harnesseval"
version = "0.0.1"
description = "Reproducible eval lab comparing AI code-review frameworks on quality and cost, calibrated against published anchors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "inspect-ai>=0.3",
    "inspect-evals>=0.1",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.uv]
package = true

[tool.setuptools]
packages = ["harnesseval", "harnesseval.dataset", "harnesseval.adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"
